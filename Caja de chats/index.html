<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <title>CHATBOX</title>
</head>
<body>
    <div class="chat">
        <!---Caja de Usuario--->
        <div class="chat__user">
            <img src="../sources/icono-medio.png" alt="Avatar del usuario">
            <span>Ana Gómez</span>
        </div>

        <div class="chat__content">
            <!---Mensaje user 1--->
            <div class="msg">
                <p class="msg__content">
                    Hola, ¿cómo va el proyecto?
                </p>
            </div>

            <!---Mensaje user 2--->
            <div class="msg self">
                <p class="msg__content">
                    Todo bien, estoy terminando la última parte del diseño.
                </p>
            </div>

            <!---Mensaje user 3--->
            <div class="msg">
                <p class="msg__content">
                    Perfecto, me avisas cuando esté listo.
                </p>
            </div>

            <!---Mensaje user 4--->
            <div class="msg self">
                <p class="msg__content">
                    Sí, te lo paso en un rato para que lo revises.
                </p>
            </div>

            <!---Mensaje user 5--->
            <div class="msg">
                <p class="msg__content">
                    Genial, gracias. También me gustaría ver la versión mobile.
                </p>
            </div>
        </div>

        <!---Caja de escritura--->
        <div class="chat__footer">
            <div class="chat__emojis" aria-label="emoji">
                <span class="material-symbols-outlined">emoji_emotions</span>
            </div>
            <div class="chat__input">
                <textarea rows="1" placeholder="Escribe tu mensaje aqui..."></textarea>
            </div>
            <div class="chat__send" aria-label="Enviar mensaje">
                <span class="material-symbols-outlined">send</span>
            </div>
        </div>
    </div>
</body>
</html>
