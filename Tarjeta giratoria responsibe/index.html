<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta giratoria responsiva</title>
</head>
<body>
    <div class="card">
        <div class="card__front">
            <picture class="card__worker">
                <source srcset="../sources/icono-medio.png" media="(max-width: 500px)">
                <img src="../sources/icono-grande.png" >
            </picture>
            <div class="card__data">
                <span>Hola mundo</span>
                <p>
                    Lorem ipsum dolor sit amet consectetur, adipisicing elit. Excepturi inventore esse asperiores laborum, impedit eius nobis tempore delectus, earum temporibus quisquam incidunt ad unde mollitia hic aut corrupti, totam vel.
                </p>
            </div>
        </div>
        <div class="card__back">
            <span>Skills</span>
            <div class="skill__bar">
                <div>HTML</div>
            </div>
            <div class="skill__bar">
                <div>CSS</div>
            </div>
            <div class="skill__bar">
                <div>PYTHON</div>
            </div>
            <div class="skill__bar">
                <div>JS</div>
            </div>
        </div>
    </div>
</body>
</html>
